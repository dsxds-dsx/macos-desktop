services:
  - type: static
    name: macos-desktop
    runtime: static
    plan: free
    staticPublishPath: ./
    buildCommand: echo "Static site - no build needed"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: NODE_ENV
        value: production
